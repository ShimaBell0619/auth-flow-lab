name: PoC On-demand Preview

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  preview:
    if: >-
      ${{ github.event.issue.pull_request &&
          github.event.comment.body == '/preview' &&
          github.event.comment.author_association == 'OWNER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Validate requested PR
        id: request
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pr_json")"
          base_repo="$(jq -r '.base.repo.full_name' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          [[ "$state" == 'open' ]]
          [[ "$base_repo" == "$REPOSITORY" ]]
          [[ "$base_ref" == 'main' ]]
          [[ "$head_repo" == "$REPOSITORY" ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "preview_branch=preview/pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main automation context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Push synthetic Preview branch
        shell: bash
        env:
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          PREVIEW_BRANCH: ${{ steps.request.outputs.preview_branch }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$HEAD_SHA"
          expected="$(git ls-remote --heads origin "refs/heads/$PREVIEW_BRANCH" | awk '{print $1}')"

          if [[ "$expected" == "$HEAD_SHA" ]]; then
            # The first PoC used the REST refs API and already created this exact ref.
            # Delete/recreate it once through Git so this run proves the push-webhook path.
            git push origin --delete "$PREVIEW_BRANCH"
            expected=''
          fi

          if [[ -n "$expected" ]]; then
            git push origin \
              "$HEAD_SHA:refs/heads/$PREVIEW_BRANCH" \
              "--force-with-lease=refs/heads/$PREVIEW_BRANCH:$expected"
          else
            git push origin "$HEAD_SHA:refs/heads/$PREVIEW_BRANCH"
          fi

          verified="$(git ls-remote --heads origin "refs/heads/$PREVIEW_BRANCH" | awk '{print $1}')"
          [[ "$verified" == "$HEAD_SHA" ]]

          {
            echo '## On-demand Preview PoC'
            echo
            echo "- PR: #$PR_NUMBER"
            echo "- Synthetic branch: \`$PREVIEW_BRANCH\`"
            echo "- Source SHA: \`$HEAD_SHA\`"
            echo '- Ref moved through Git push; Vercel Git Integration owns deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
