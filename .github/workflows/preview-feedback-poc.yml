name: PoC Preview Feedback

on:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [vercel.deployment.success]

permissions: {}

jobs:
  request-preview:
    if: >-
      ${{ github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.body == '/preview' &&
          github.event.comment.author_association == 'OWNER' }}
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Validate requested PR
        id: request
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pr_json")"
          base_repo="$(jq -r '.base.repo.full_name' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          [[ "$state" == 'open' ]]
          [[ "$base_repo" == "$REPOSITORY" ]]
          [[ "$base_ref" == 'main' ]]
          [[ "$head_repo" == "$REPOSITORY" ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "preview_branch=preview/pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main automation context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Push content-identical synthetic Preview commit
        shell: bash
        env:
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          PREVIEW_BRANCH: ${{ steps.request.outputs.preview_branch }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$HEAD_SHA"
          tree_sha="$(git show -s --format=%T "$HEAD_SHA")"
          source_author_name="$(git show -s --format=%an "$HEAD_SHA")"
          source_author_email="$(git show -s --format=%ae "$HEAD_SHA")"

          export GIT_AUTHOR_NAME="$source_author_name"
          export GIT_AUTHOR_EMAIL="$source_author_email"
          export GIT_COMMITTER_NAME='On-demand Preview PoC'
          export GIT_COMMITTER_EMAIL='112917105+ShimaBell0619@users.noreply.github.com'

          synthetic_sha="$({
            echo "On-demand Preview for PR #$PR_NUMBER"
            echo
            echo "Source-PR-HEAD: $HEAD_SHA"
          } | git commit-tree "$tree_sha" -p "$HEAD_SHA")"

          [[ "$(git show -s --format=%T "$synthetic_sha")" == "$tree_sha" ]]
          [[ "$(git show -s --format=%P "$synthetic_sha")" == "$HEAD_SHA" ]]
          git diff --quiet "$HEAD_SHA" "$synthetic_sha"

          expected="$(git ls-remote --heads origin "refs/heads/$PREVIEW_BRANCH" | awk '{print $1}')"
          if [[ -n "$expected" ]]; then
            git push origin \
              "$synthetic_sha:refs/heads/$PREVIEW_BRANCH" \
              "--force-with-lease=refs/heads/$PREVIEW_BRANCH:$expected"
          else
            git push origin "$synthetic_sha:refs/heads/$PREVIEW_BRANCH"
          fi

          verified="$(git ls-remote --heads origin "refs/heads/$PREVIEW_BRANCH" | awk '{print $1}')"
          [[ "$verified" == "$synthetic_sha" ]]

          {
            echo '## On-demand Preview feedback PoC'
            echo
            echo "- PR: #$PR_NUMBER"
            echo "- Source A: \`$HEAD_SHA\`"
            echo "- Synthetic B: \`$synthetic_sha\`"
            echo "- Branch: \`$PREVIEW_BRANCH\`"
            echo "- Verified: \`parent(B)=A\`, \`tree(B)=tree(A)\`, empty diff"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-vercel-success:
    if: ${{ github.event_name == 'repository_dispatch' }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PAYLOAD: ${{ toJSON(github.event.client_payload) }}
    steps:
      - name: Validate deployment and comment real Preview URL
        shell: bash
        run: |
          set -euo pipefail

          environment="$(jq -r '.environment // empty' <<<"$PAYLOAD")"
          project_name="$(jq -r '.project.name // empty' <<<"$PAYLOAD")"
          state="$(jq -r '.state.type // empty' <<<"$PAYLOAD")"
          preview_ref="$(jq -r '.git.ref // empty' <<<"$PAYLOAD")"
          synthetic_sha="$(jq -r '.git.sha // empty' <<<"$PAYLOAD")"
          preview_url="$(jq -r '.url // empty' <<<"$PAYLOAD")"
          deployment_id="$(jq -r '.id // empty' <<<"$PAYLOAD")"
          branch_alias="$(jq -r '.alias[0] // empty' <<<"$PAYLOAD")"

          [[ "$environment" == 'preview' ]]
          [[ "$project_name" == 'auth-flow-lab' ]]
          [[ "$state" == 'success' ]]
          [[ "$preview_ref" =~ ^preview/pr-([0-9]+)$ ]]
          pr_number="${BASH_REMATCH[1]}"
          [[ "$synthetic_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$preview_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          [[ "$(jq -r '.state' <<<"$pr_json")" == 'open' ]]
          [[ "$(jq -r '.base.repo.full_name' <<<"$pr_json")" == "$REPOSITORY" ]]
          [[ "$(jq -r '.base.ref' <<<"$pr_json")" == 'main' ]]
          [[ "$(jq -r '.head.repo.full_name' <<<"$pr_json")" == "$REPOSITORY" ]]
          source_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          current_preview_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/$preview_ref" --jq '.object.sha')"
          [[ "$current_preview_sha" == "$synthetic_sha" ]]

          synthetic_json="$(gh api "repos/$REPOSITORY/git/commits/$synthetic_sha")"
          [[ "$(jq '.parents | length' <<<"$synthetic_json")" -eq 1 ]]
          [[ "$(jq -r '.parents[0].sha' <<<"$synthetic_json")" == "$source_sha" ]]
          synthetic_tree="$(jq -r '.tree.sha' <<<"$synthetic_json")"
          [[ "$(jq -r '.message' <<<"$synthetic_json")" == *"Source-PR-HEAD: $source_sha"* ]]

          source_tree="$(gh api "repos/$REPOSITORY/git/commits/$source_sha" --jq '.tree.sha')"
          [[ "$synthetic_tree" == "$source_tree" ]]

          body=$(cat <<EOF
          Preview ready.

          - URL: $preview_url
          - Source: \`${source_sha:0:7}\`
          - Deployment commit: \`${synthetic_sha:0:7}\`
          - Branch: \`$preview_ref\`
          - Vercel deployment: \`$deployment_id\`
          EOF
          )
          if [[ -n "$branch_alias" ]]; then
            body+=$'\n'
            body+="Branch URL: https://$branch_alias"
          fi

          gh api --method POST "repos/$REPOSITORY/issues/$pr_number/comments" -f body="$body" >/dev/null

          {
            echo '## Preview feedback verified'
            echo
            echo "- PR: #$pr_number"
            echo "- Source A: \`$source_sha\`"
            echo "- Synthetic B: \`$synthetic_sha\`"
            echo "- URL: $preview_url"
            echo "- Ref: \`$preview_ref\`"
          } >> "$GITHUB_STEP_SUMMARY"
