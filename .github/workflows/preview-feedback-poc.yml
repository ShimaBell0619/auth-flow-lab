name: PoC Preview Feedback

on:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [vercel.deployment.success]

permissions: {}

jobs:
  request-preview:
    if: >-
      ${{ github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.body == '/preview' &&
          github.event.comment.author_association == 'OWNER' }}
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Validate requested PR
        id: request
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pr_json")"
          base_repo="$(jq -r '.base.repo.full_name' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          [[ "$state" == 'open' ]]
          [[ "$base_repo" == "$REPOSITORY" ]]
          [[ "$base_ref" == 'main' ]]
          [[ "$head_repo" == "$REPOSITORY" ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "preview_branch=preview/pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main automation context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Push content-identical synthetic Preview commit
        shell: bash
        env:
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          PREVIEW_BRANCH: ${{ steps.request.outputs.preview_branch }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$HEAD_SHA"
          tree_sha="$(git show -s --format=%T "$HEAD_SHA")"
          source_author_name="$(git show -s --format=%an "$HEAD_SHA")"
          source_author_email="$(git show -s --format=%ae "$HEAD_SHA")"

          export GIT_AUTHOR_NAME="$source_author_name"
          export GIT_AUTHOR_EMAIL="$source_author_email"
          export GIT_COMMITTER_NAME='On-demand Preview PoC'
          export GIT_COMMITTER_EMAIL='112917105+ShimaBell0619@users.noreply.github.com'

          synthetic_sha="$({
            echo "On-demand Preview for PR #$PR_NUMBER"
            echo
            echo "Source-PR-HEAD: $HEAD_SHA"
          } | git commit-tree "$tree_sha" -p "$HEAD_SHA")"

          [[ "$(git show -s --format=%T "$synthetic_sha")" == "$tree_sha" ]]
          [[ "$(git show -s --format=%P "$synthetic_sha")" == "$HEAD_SHA" ]]
          git diff --quiet "$HEAD_SHA" "$synthetic_sha"

          expected="$(git ls-remote --heads origin "refs/heads/$PREVIEW_BRANCH" | awk '{print $1}')"
          if [[ -n "$expected" ]]; then
            git push origin \
              "$synthetic_sha:refs/heads/$PREVIEW_BRANCH" \
              "--force-with-lease=refs/heads/$PREVIEW_BRANCH:$expected"
          else
            git push origin "$synthetic_sha:refs/heads/$PREVIEW_BRANCH"
          fi

          verified="$(git ls-remote --heads origin "refs/heads/$PREVIEW_BRANCH" | awk '{print $1}')"
          [[ "$verified" == "$synthetic_sha" ]]

          {
            echo '## On-demand Preview feedback PoC'
            echo
            echo "- PR: #$PR_NUMBER"
            echo "- Source A: \`$HEAD_SHA\`"
            echo "- Synthetic B: \`$synthetic_sha\`"
            echo "- Branch: \`$PREVIEW_BRANCH\`"
            echo "- Verified: \`parent(B)=A\`, \`tree(B)=tree(A)\`, empty diff"
          } >> "$GITHUB_STEP_SUMMARY"

  observe-vercel-success:
    if: ${{ github.event_name == 'repository_dispatch' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PAYLOAD: ${{ toJSON(github.event.client_payload) }}
    steps:
      - name: Record observed Vercel payload
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Observed Vercel repository_dispatch payload'
            echo
            echo '```json'
            jq . <<<"$PAYLOAD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo 'Observed payload keys:'
          jq -r 'keys[]' <<<"$PAYLOAD"
          echo 'Documented deployment URL field:'
          jq -r '.url // empty' <<<"$PAYLOAD"
